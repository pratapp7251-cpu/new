<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Product Details | ToolYard Catalogue</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f4f5f7; color: #1f2937; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-white border-b border-gray-200 shadow-xs">
    <div class="max-w-[1360px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <a href="/index.html" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-red-600 text-white font-black flex items-center justify-center">TY</div>
        <div>
          <div class="font-extrabold text-lg text-gray-900 leading-none">ToolYard</div>
          <div class="text-[10px] font-semibold uppercase tracking-wider text-gray-500">B2B Industrial Store</div>
        </div>
      </a>

      <div class="flex items-center gap-3">
        <a href="/index.html" class="px-3 py-2 rounded-md border border-gray-300 text-xs font-semibold text-gray-700 hover:bg-gray-50">
          &larr; Back to Catalogue
        </a>
        <a href="/admin.html" class="hidden sm:inline-flex px-3 py-2 rounded-md border border-gray-300 text-xs font-semibold text-gray-700 hover:bg-gray-50">
          Admin CMS
        </a>
      </div>
    </div>
  </header>

  <!-- BREADCRUMB -->
  <div class="max-w-[1360px] w-full mx-auto px-4 sm:px-6 pt-4 pb-2 text-xs text-gray-500">
    <a href="/index.html" class="hover:text-red-600">Home</a>
    <span class="mx-1">&gt;</span>
    <span id="crumbCategory">Hand Tools</span>
    <span id="crumbSubCategoryWrap" class="hidden"><span class="mx-1">&gt;</span><span id="crumbSubCategory"></span></span>
    <span class="mx-1">&gt;</span>
    <span id="crumbName" class="text-gray-800 font-medium">Loading...</span>
  </div>

  <!-- PRODUCT DETAIL & VARIANTS -->
  <main class="flex-1 max-w-[1360px] w-full mx-auto px-4 sm:px-6 py-3 space-y-6">
    <div id="productContainer" class="bg-white border border-gray-200 rounded-lg p-5 sm:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
      <div class="col-span-full text-center py-12 text-sm text-gray-500">Loading product details...</div>
    </div>

    <div id="variantMatrixContainer"></div>
  </main>

  <script>
    let currentProduct = null;
    let selectedVariantIdx = 0;

    document.addEventListener('DOMContentLoaded', loadProductDetail);

    async function loadProductDetail() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        document.getElementById('productContainer').innerHTML =
          `<div class="col-span-full text-center py-12 text-sm text-red-600">No product selected. <a href="/index.html" class="underline">Return to storefront</a>.</div>`;
        return;
      }

      try {
        const res = await fetch(`/api/products?id=${encodeURIComponent(id)}`);
        const data = await res.json();
        const product = (data.products || []).find(p => String(p.id) === String(id));

        if (!product) {
          document.getElementById('productContainer').innerHTML =
            `<div class="col-span-full text-center py-12 text-sm text-gray-600">Product not found. <a href="/index.html" class="text-red-600 underline">Back to Catalogue</a></div>`;
          return;
        }

        currentProduct = product;
        document.title = `${product.name} | ToolYard`;
        document.getElementById('crumbCategory').textContent = product.category_name || 'Tools';

        const subWrap = document.getElementById('crumbSubCategoryWrap');
        const subEl = document.getElementById('crumbSubCategory');
        if (product.sub_category) {
          subEl.textContent = product.sub_category;
          subWrap.classList.remove('hidden');
        } else {
          subWrap.classList.add('hidden');
        }

        document.getElementById('crumbName').textContent = product.name;
        renderProductDetail();
      } catch (err) {
        document.getElementById('productContainer').innerHTML =
          `<div class="col-span-full text-center py-12 text-sm text-red-600">Error loading product from server.</div>`;
      }
    }

    function hasValue(val) {
      return val !== undefined && val !== null && String(val).trim() !== '' && String(val).trim() !== '-';
    }

    function parseCustomSpecs(raw) {
      if (!raw) return {};
      if (typeof raw === 'object') return raw;
      try {
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch (_) {
        return {};
      }
    }

    function computeVariantPricing(product, variant = {}) {
  const discPct = Number(variant.discount_percent ?? product.discount_percent ?? 0) || 0;
  const gstPct = Number(variant.gst_percent ?? product.gst_percent ?? 18) || 0;
  const taxMode = variant.price_tax_mode === 'inc' ? 'inc' : 'ex';

  const rawMrp = Number(variant.mrp) || 0;
  const rawPrice = Number(variant.price) || 0;

  let exGst = rawPrice;
  let mrpExGst = rawMrp;

  if (mrpExGst > 0 && discPct > 0 && rawPrice === 0) {
    exGst = mrpExGst * (1 - discPct / 100);
  } else if (exGst > 0 && discPct > 0 && discPct < 100 && (!mrpExGst || mrpExGst <= exGst)) {
    mrpExGst = exGst / (1 - discPct / 100);
  } else if (mrpExGst === 0 && exGst > 0) {
    mrpExGst = exGst;
  }

  // If variant.price is already stored as GST-inclusive (e.g. direct Incl. GST without prior division),
  // keep rawPrice as-is; otherwise compute GST-inclusive display price from Ex-GST.
  const alreadyIncl = Boolean(variant.already_incl_gst);
  const shownRate = alreadyIncl
    ? rawPrice
    : Number((exGst * (1 + gstPct / 100)).toFixed(2));
  const shownMrp = alreadyIncl
    ? rawMrp
    : Number((mrpExGst * (1 + gstPct / 100)).toFixed(2));
  const gstTag = taxMode === 'inc' ? `Incl. ${gstPct}% GST` : `+ ${gstPct}% GST`;

  return {
    discPct,
    gstPct,
    taxMode,
    gstTag,
    exGst: Number(exGst.toFixed(2)),
    shownRate,
    shownMrp
  };
}

    function formatINR(val) {
      return `₹${Number(val || 0).toLocaleString('en-IN', {
        minimumFractionDigits: Number(val) % 1 === 0 ? 0 : 2,
        maximumFractionDigits: 2
      })}`;
    }

    function selectVariant(idx) {
      selectedVariantIdx = idx;
      renderProductDetail();
    }

    function renderProductDetail() {
      const p = currentProduct;
      const variants = p.variants && p.variants.length
        ? p.variants
        : [{ size: 'Standard', sku: '', price: 0, stock: 'In Stock' }];
      const v = variants[selectedVariantIdx] || variants[0];
      const pricing = computeVariantPricing(p, v);
      const customSpecs = parseCustomSpecs(v.custom_specs);
      const brand = p.brand || 'Taparia';
      const effectiveFinish = hasValue(v.finish) ? v.finish.trim() : (hasValue(p.finish) ? p.finish.trim() : '');
      const hasDisc = pricing.discPct > 0 && pricing.shownMrp > pricing.shownRate;

      // Only show extra tag on pill if variants have distinct openings or packaging
      const distinctOpenings = new Set(variants.map(x => (x.opening || '').trim()).filter(Boolean));
      const distinctPkgs = new Set(variants.map(x => (x.packaging || '').trim()).filter(Boolean));

      const imgHtml = hasValue(p.image)
        ? `<img src="${escapeAttr(p.image)}" alt="${escapeHtml(p.name)}" class="max-h-96 max-w-full object-contain" />`
        : `<div class="h-72 flex items-center justify-center text-sm text-gray-400">No Image Available</div>`;

      const sizeButtons = variants.map((item, idx) => {
        const pillExtras = [];
        if (distinctOpenings.size > 1 && hasValue(item.opening)) pillExtras.push(item.opening.trim());
        if (distinctPkgs.size > 1 && hasValue(item.packaging)) pillExtras.push(item.packaging.trim());
        const label = pillExtras.length ? `${item.size} (${pillExtras.join(' · ')})` : item.size;

        return `
          <button type="button" onclick="selectVariant(${idx})"
            class="px-3 py-1.5 rounded-md border text-xs font-semibold transition ${
              idx === selectedVariantIdx
                ? 'border-blue-600 bg-blue-600 text-white shadow-2xs'
                : 'border-gray-300 bg-white hover:border-blue-400 text-gray-700'
            }">
            ${escapeHtml(label)}
          </button>
        `;
      }).join('');

      // Build spec rows only for non-empty fields
      const specRows = [];
      if (hasValue(brand)) specRows.push(['Brand', escapeHtml(brand)]);
      if (hasValue(p.category_name)) specRows.push(['Category', escapeHtml(p.category_name)]);
      if (hasValue(p.sub_category)) specRows.push(['Subcategory', escapeHtml(p.sub_category)]);
      if (hasValue(p.series)) specRows.push(['Model / Series', `<span class="font-mono">${escapeHtml(p.series)}</span>`]);
      if (hasValue(effectiveFinish)) specRows.push(['Finish', escapeHtml(effectiveFinish)]);
      if (hasValue(v.size)) specRows.push(['Selected Size', `<span class="font-semibold">${escapeHtml(v.size)}</span>`]);
      if (hasValue(v.opening)) specRows.push(['Opening / Capacity', escapeHtml(v.opening)]);
      if (hasValue(v.packaging)) specRows.push(['Packaging', escapeHtml(v.packaging)]);

      Object.entries(customSpecs).forEach(([k, val]) => {
        if (hasValue(k) && hasValue(val)) {
          specRows.push([escapeHtml(k.trim()), escapeHtml(String(val).trim())]);
        }
      });

      if (hasValue(v.sku)) specRows.push(['SKU Code', `<span class="font-mono">${escapeHtml(v.sku)}</span>`]);

      const specRowsHtml = specRows.map(([label, valHtml]) => `
        <tr>
          <td class="py-2 px-3 bg-gray-50 font-semibold text-gray-600 w-1/3">${label}</td>
          <td class="py-2 px-3 text-gray-800">${valHtml}</td>
        </tr>
      `).join('');

      const metaLineParts = [];
      if (hasValue(brand)) metaLineParts.push(`Brand: <strong class="text-gray-800">${escapeHtml(brand)}</strong>`);
      if (hasValue(p.series)) metaLineParts.push(`Model: <strong class="text-gray-800">${escapeHtml(p.series)}</strong>`);
      if (hasValue(v.sku)) metaLineParts.push(`SKU: <span class="font-mono text-gray-800">${escapeHtml(v.sku)}</span>`);

      document.getElementById('productContainer').innerHTML = `
        <div class="lg:col-span-5 flex flex-col items-center justify-center border border-gray-200 rounded-lg p-6 bg-white lg:sticky lg:top-20 self-start">
          ${imgHtml}
        </div>

        <div class="lg:col-span-7 space-y-5">
          <div>
            <div class="flex flex-wrap items-center gap-2 mb-2">
              ${hasValue(p.category_name) ? `<span class="inline-block text-[11px] font-bold uppercase px-2.5 py-0.5 rounded bg-blue-50 text-blue-700">${escapeHtml(p.category_name)}</span>` : ''}
              ${hasValue(p.sub_category) ? `<span class="inline-block text-[11px] font-semibold px-2.5 py-0.5 rounded bg-gray-100 text-gray-700">${escapeHtml(p.sub_category)}</span>` : ''}
              ${hasDisc ? `<span class="inline-block text-[11px] font-bold px-2.5 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200">${pricing.discPct}% OFF</span>` : ''}
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-gray-900 leading-snug">${escapeHtml(p.name)}</h1>
            ${metaLineParts.length ? `<p class="text-xs text-gray-500 mt-1.5">${metaLineParts.join(' • ')}</p>` : ''}
          </div>

          <div class="p-4 rounded-lg bg-gray-50 border border-gray-200 space-y-1">
            <div class="flex items-center justify-between text-xs text-gray-500">
              <span>${escapeHtml(pricing.gstTag)}</span>
              <span class="font-semibold text-emerald-600">${escapeHtml(v.stock || 'In Stock')}</span>
            </div>
            <div class="flex items-baseline gap-3">
              ${hasDisc ? `<span class="text-base line-through text-gray-400 font-mono">${formatINR(pricing.shownMrp)}</span>` : ''}
              <span class="text-3xl font-extrabold text-gray-900">${formatINR(pricing.shownRate)}</span>
            </div>
          </div>

          <div class="space-y-2">
            <div class="text-xs font-bold uppercase tracking-wide text-gray-600">
              Select Size (${variants.length} ${variants.length === 1 ? 'option' : 'options'}):
            </div>
            <div class="flex flex-wrap gap-2">${sizeButtons}</div>
          </div>

          <div class="flex flex-wrap items-center gap-3 pt-2">
            <div class="flex items-center border border-gray-300 rounded-md overflow-hidden bg-white">
              <button type="button" onclick="stepQty(-1)" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 font-bold text-sm">−</button>
              <input id="detailQty" type="number" min="1" value="1" class="w-14 text-center text-sm font-mono focus:outline-none" />
              <button type="button" onclick="stepQty(1)" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 font-bold text-sm">+</button>
            </div>

            <button type="button" onclick="addDetailToCart()"
              class="px-6 py-2.5 rounded-md bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold uppercase tracking-wide transition">
              Add to Cart
            </button>
          </div>

          ${specRowsHtml || hasValue(p.description) ? `
            <div class="pt-4 border-t border-gray-200 space-y-2.5">
              <h2 class="text-sm font-bold text-gray-900 uppercase">Product Specifications &amp; Details</h2>
              ${specRowsHtml ? `
                <table class="w-full text-xs border border-gray-200 rounded-md overflow-hidden">
                  <tbody class="divide-y divide-gray-200">${specRowsHtml}</tbody>
                </table>
              ` : ''}

              ${hasValue(p.description) ? `
                <div class="pt-2">
                  <h3 class="text-xs font-bold uppercase text-gray-600 mb-1">Description</h3>
                  <p class="text-xs text-gray-700 leading-relaxed whitespace-pre-line">${escapeHtml(p.description)}</p>
                </div>
              ` : ''}
            </div>
          ` : ''}
        </div>
      `;

      renderVariantMatrix(p, variants, selectedVariantIdx);
    }

    function renderVariantMatrix(product, variants, activeIdx) {
      const container = document.getElementById('variantMatrixContainer');
      if (!container || variants.length <= 1) {
        if (container) container.innerHTML = '';
        return;
      }

      // Determine which columns have at least one non-empty value across variants
      const showSku = variants.some(item => hasValue(item.sku));
      const showSize = variants.some(item => hasValue(item.size));
      const showOpening = variants.some(item => hasValue(item.opening));
      const showFinish = variants.some(item => hasValue(item.finish || product.finish));
      const showPackaging = variants.some(item => hasValue(item.packaging));

      const allCustomKeys = Array.from(new Set(
        variants.flatMap(item => Object.keys(parseCustomSpecs(item.custom_specs)))
      ));
      const activeCustomKeys = allCustomKeys.filter(k =>
        variants.some(item => hasValue(parseCustomSpecs(item.custom_specs)[k]))
      );

      const headers = [];
      if (showSku) headers.push('<th class="py-2.5 px-3">SKU</th>');
      if (showSize) headers.push('<th class="py-2.5 px-3">Size</th>');
      if (showOpening) headers.push('<th class="py-2.5 px-3">Opening</th>');
      if (showFinish) headers.push('<th class="py-2.5 px-3">Finish</th>');
      if (showPackaging) headers.push('<th class="py-2.5 px-3">Packaging</th>');
      activeCustomKeys.forEach(k => headers.push(`<th class="py-2.5 px-3">${escapeHtml(k)}</th>`));
      headers.push('<th class="py-2.5 px-3">Price</th>');
      headers.push('<th class="py-2.5 px-3 text-right">Action</th>');

      const rowsHtml = variants.map((item, i) => {
        const vp = computeVariantPricing(product, item);
        const cMap = parseCustomSpecs(item.custom_specs);
        const isSel = i === activeIdx;

        const cells = [];
        if (showSku) cells.push(`<td class="py-2 px-3 font-mono text-gray-700">${hasValue(item.sku) ? escapeHtml(item.sku) : '—'}</td>`);
        if (showSize) cells.push(`<td class="py-2 px-3 text-gray-900 font-medium">${hasValue(item.size) ? escapeHtml(item.size) : '—'}</td>`);
        if (showOpening) cells.push(`<td class="py-2 px-3 text-gray-700">${hasValue(item.opening) ? escapeHtml(item.opening) : '—'}</td>`);
        if (showFinish) {
          const fin = hasValue(item.finish) ? item.finish : (hasValue(product.finish) ? product.finish : '');
          cells.push(`<td class="py-2 px-3 text-gray-700">${hasValue(fin) ? escapeHtml(fin) : '—'}</td>`);
        }
        if (showPackaging) cells.push(`<td class="py-2 px-3 text-gray-700">${hasValue(item.packaging) ? escapeHtml(item.packaging) : '—'}</td>`);

        activeCustomKeys.forEach(k => {
          const val = cMap[k];
          cells.push(`<td class="py-2 px-3 text-gray-700">${hasValue(val) ? escapeHtml(String(val)) : '—'}</td>`);
        });

        cells.push(`
          <td class="py-2 px-3 font-mono font-semibold text-gray-900">
            ${formatINR(vp.shownRate)} <span class="text-[10px] font-sans font-normal text-gray-500">(${escapeHtml(vp.gstTag)})</span>
          </td>
        `);

        cells.push(`
          <td class="py-2 px-3 text-right">
            <button type="button" onclick="selectVariant(${i})"
              class="px-2.5 py-1 rounded text-[11px] font-semibold ${isSel ? 'bg-blue-600 text-white' : 'border border-gray-300 text-gray-700 hover:bg-gray-100'}">
              ${isSel ? 'Selected' : 'Select'}
            </button>
          </td>
        `);

        return `<tr class="${isSel ? 'bg-blue-50/50' : 'hover:bg-gray-50'}">${cells.join('')}</tr>`;
      }).join('');

      container.innerHTML = `
        <div class="bg-white border border-gray-200 rounded-lg p-5 sm:p-6">
          <h2 class="text-sm font-bold text-gray-900 uppercase mb-3">All Variants</h2>
          <div class="overflow-x-auto border border-gray-200 rounded-md">
            <table class="w-full text-left border-collapse text-xs">
              <thead class="bg-gray-50 text-gray-600 border-b border-gray-200">
                <tr>${headers.join('')}</tr>
              </thead>
              <tbody class="divide-y divide-gray-200">${rowsHtml}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function stepQty(delta) {
      const inp = document.getElementById('detailQty');
      const next = Math.max(1, (parseInt(inp.value, 10) || 1) + delta);
      inp.value = next;
    }

    function addDetailToCart() {
      const p = currentProduct;
      const variants = p.variants && p.variants.length ? p.variants : [{ size: 'Standard', sku: p.id, price: 0 }];
      const v = variants[selectedVariantIdx] || variants[0];
      const pricing = computeVariantPricing(p, v);
      const qty = Math.max(1, parseInt(document.getElementById('detailQty').value, 10) || 1);

      const cart = JSON.parse(localStorage.getItem('ty_store_cart') || '[]');
      const key = `${p.id}__${v.size}__${v.sku}`;
      const existing = cart.find(i => i.key === key);
      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({
          key,
          name: p.name,
          brand: p.brand || 'Taparia',
          size: v.size,
          sku: v.sku,
          unitPrice: pricing.shownRate,
          gstTag: pricing.gstTag,
          qty
        });
      }

      localStorage.setItem('ty_store_cart', JSON.stringify(cart));
      window.location.href = '/index.html';
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
